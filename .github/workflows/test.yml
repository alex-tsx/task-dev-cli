name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain:
          - { node: 22, npm: 11 }
          - { node: 24, npm: 11 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.toolchain.node }}
          cache: npm
      - run: npm install --global npm@${{ matrix.toolchain.npm }}
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
